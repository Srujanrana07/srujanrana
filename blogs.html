  <style>
    :root {
      --custom-dark-bg: #272935;
      --global-bg: #f9f9f9;
      --global-text-color: #333;
      --card-bg: #fff;
      --heading-color: #333;
      --primary: #1565c0;
      --global-muted-color: #555;
      --link-color: #1565c0;
      --link-hover-color: #fff;
      --primary-dark: #0d47a1;
      --global-border-color: #e0e0e0;
      --global-hover-color: #f5f5f5;
    }

    body.dark {
      --global-bg: #272935;
      --global-text-color: #f0f0f0;
      --card-bg: #2d3748;
      --heading-color: #ffffff;
      --global-muted-color: #b0b0b0;
      --global-border-color: #4a5568;
      --global-hover-color: #3c4556;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--global-bg);
      color: var(--global-text-color);
      margin: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1140px;
      margin: auto;
      padding: 80px 20px 40px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--heading-color);
      text-align: center;
      margin-bottom: 2rem;
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .blog-card {
      background: var(--card-bg);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
      transition: all 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
    }

    .blog-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .blog-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .blog-card-body {
      padding: 20px;
      flex: 1;
    }

    .blog-card-body h4 {
      font-size: 1.3rem;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .blog-card-body p {
      color: var(--global-muted-color);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .blog-card-body a {
      display: inline-block;
      margin-top: 12px;
      color: var(--link-color);
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--link-color);
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .blog-card-body a:hover {
      background-color: var(--link-color);
      color: var(--link-hover-color);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 40px;
    }

    .pagination button {
      padding: 10px 18px;
      font-size: 1rem;
      background-color: var(--primary);
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .pagination button:hover:not(:disabled) {
      background-color: var(--primary-dark);
    }

    .pagination button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* Theme Toggle Styles */
    .theme-dropdown .dropdown-menu {
      min-width: 120px;
      border: 1px solid var(--global-border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      background: var(--card-bg);
    }

    .theme-dropdown .dropdown-item {
      padding: 8px 16px;
      font-size: 0.9rem;
      color: var(--global-text-color);
      transition: all 0.2s ease;
    }

    .theme-dropdown .dropdown-item:hover {
      background-color: var(--global-hover-color);
    }

    #theme-icon {
      font-size: 1.2rem;
      vertical-align: middle;
      color: var(--global-text-color);
    }
  </style>

  <div class="container">
    <h1>All Blogs</h1>
    <div id="blogs" class="blog-grid"></div>

    <div class="pagination">
      <button onclick="changePage(-1)" id="prev">Previous</button>
      <button onclick="changePage(1)" id="next">Next</button>
    </div>
  </div>

  <script>
    const blogsPerPage = 3;
    let currentPage = 1;

    const blogs = [
      {
        title: "Semantic Search for AI",
        desc: "Semantic search leverages NLP to understand the meaning behind queries for better results.",
        img: "https://miro.medium.com/v2/resize:fit:1100/format:webp/1*orMOScrEbwajvNLAkvDk0Q.jpeg",
        link: "https://medium.com/@srujanrana07/semantic-search-for-ai-a1d97fe06903"
      },
      {
        title: "AI in Gaming: NPCs that Think",
        desc: "How intelligent NPCs revolutionize game dynamics by reacting and learning in real-time.",
        img: "https://miro.medium.com/v2/resize:fit:1100/format:webp/1*drG5TqqLETnKg83hiMIX-Q.png",
        link: "https://medium.com/@srujanrana07/ai-in-gaming-npcs-that-think-1d43671e8c28"
      },
      {
        title: "My Research Journey at NIT Raipur",
        desc: "Deploying CNN-BiLSTM models for voice stress analysis in real-time applications.",
        img: "https://miro.medium.com/v2/resize:fit:1100/format:webp/1*C6Gi3Kp3kmHa2R9Bfnp9uA.jpeg",
        link: "https://medium.com/@srujanrana07/my-research-journey-at-nit-raipur-from-cnns-to-sunburns-2f7af0736790"
      },
      {
        title: "Building Smarter AI Agents with MCP",
        desc: "MCP enables multi-agent systems to plan, coordinate, and execute actions autonomously.",
        img: "https://miro.medium.com/v2/resize:fit:1100/format:webp/0*WvxxTJupaYEdM0I2",
        link: "https://medium.com/@srujanrana07/building-smarter-ai-agents-with-mcp-message-control-protocol-83f3cc708c59"
      }
    ];

    function displayBlogs() {
      const blogContainer = document.getElementById("blogs");
      blogContainer.innerHTML = "";

      const start = (currentPage - 1) * blogsPerPage;
      const end = start + blogsPerPage;
      const currentBlogs = blogs.slice(start, end);

      currentBlogs.forEach(blog => {
        blogContainer.innerHTML += `
          <div class="blog-card">
            <img src="${blog.img}" alt="${blog.title}">
            <div class="blog-card-body">
              <h4>${blog.title}</h4>
              <p>${blog.desc}</p>
              <a href="${blog.link}" target="_blank">Read More</a>
            </div>
          </div>
        `;
      });

      document.getElementById("prev").disabled = currentPage === 1;
      document.getElementById("next").disabled = end >= blogs.length;
    }

    function changePage(delta) {
      currentPage += delta;
      displayBlogs();
    }

    // Theme Management
    function updateThemeIcon() {
      const theme = localStorage.getItem('dark_mode') || 
                   document.documentElement.getAttribute('data-dark-mode') || 
                   'auto';
      const icon = document.getElementById('theme-icon');
      
      if (!icon) return;
      
      if (theme === '1' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        icon.classList.replace('fa-moon', 'fa-sun');
      } else {
        icon.classList.replace('fa-sun', 'fa-moon');
      }
    }

    function setTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark');
        localStorage.setItem('dark_mode', '1');
      } else if (theme === 'light') {
        document.body.classList.remove('dark');
        localStorage.setItem('dark_mode', '0');
      } else {
        // Auto mode
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.body.classList.add('dark');
        } else {
          document.body.classList.remove('dark');
        }
        localStorage.setItem('dark_mode', 'auto');
      }
      updateThemeIcon();
    }

    // Initialize theme
    document.addEventListener('DOMContentLoaded', () => {
      displayBlogs();
      
      // Check for saved theme preference
      const savedTheme = localStorage.getItem('dark_mode');
      if (savedTheme) {
        setTheme(savedTheme === '1' ? 'dark' : savedTheme === '0' ? 'light' : 'auto');
      } else {
        // Default to auto
        setTheme('auto');
      }

      // Theme toggle handlers
      document.querySelectorAll('.js-set-theme-light').forEach(el => {
        el.addEventListener('click', () => setTheme('light'));
      });
      
      document.querySelectorAll('.js-set-theme-dark').forEach(el => {
        el.addEventListener('click', () => setTheme('dark'));
      });
      
      document.querySelectorAll('.js-set-theme-auto').forEach(el => {
        el.addEventListener('click', () => setTheme('auto'));
      });

      // Watch for system theme changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (localStorage.getItem('dark_mode') === 'auto') {
          setTheme('auto');
        }
      });
    });

    // Listen for Wowchemy theme changes if available
    if (typeof window.wc !== 'undefined') {
      document.addEventListener('wcThemeSet', updateThemeIcon);
    }
  </script>
